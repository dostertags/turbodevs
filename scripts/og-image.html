<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  /* Self-hosted from node_modules — the same two faces the live site loads,
     so the preview card matches the page it links to. */
  @font-face {
    font-family: 'Newsreader Variable';
    src: url('../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-opsz-normal.woff2') format('woff2-variations');
    font-weight: 200 800;
    font-style: normal;
  }
  @font-face {
    font-family: 'Mona Sans Variable';
    src: url('../node_modules/@fontsource-variable/mona-sans/files/mona-sans-latin-wght-normal.woff2') format('woff2-variations');
    font-weight: 200 900;
    font-style: normal;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    background: #f6f4ef;
    color: #17150f;
    overflow: hidden;
    font-family: 'Mona Sans Variable', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  .stage {
    position: relative;
    width: 1200px;
    height: 630px;
    padding: 72px 84px 64px;
    display: flex;
    flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 14px; font-family: 'Newsreader Variable', Georgia, serif; font-size: 34px; }
  .brand svg { width: 40px; height: 40px; }
  .headline {
    margin-top: 64px;
    font-family: 'Newsreader Variable', Georgia, serif;
    font-weight: 400;
    font-size: 84px;
    line-height: 1.02;
    letter-spacing: -0.02em;
    max-width: 900px;
  }
  .tagline { margin-top: 26px; font-size: 24px; color: #5b554b; max-width: 820px; line-height: 1.4; }
  .strip { margin-top: auto; }
</style>
</head>
<body>
  <div class="stage">
    <div class="brand">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <path d="M8.6 22.4 L16.3 9.8 L24.1 20.6" fill="none" stroke="#17150f" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="8.6" cy="22.4" r="2.1" fill="#17150f" />
        <circle cx="16.3" cy="9.8" r="2.6" fill="#8a5a14" />
        <circle cx="24.1" cy="20.6" r="2.1" fill="#17150f" />
      </svg>
      TurboDevs
    </div>
    <div class="headline">Software for operations that can't stop.</div>
    <div class="tagline">Software engineering studio. We find the process that costs your team most, replace it with software, and keep it running 24/7.</div>
    <svg class="strip" id="strip" viewBox="0 0 1032 64" width="1032" height="64"></svg>
  </div>
  <script>
    // Same motif as the site's hero: a day in 15-minute steps, a constant
    // dark base (it never stops) under a lighter daylight band.
    const svg = document.getElementById("strip")
    const steps = 96, pitch = 1032 / steps, bar = pitch * 0.42
    for (let i = 0; i < steps; i++) {
      const hour = (i + 0.5) / 4
      const sun = hour < 6.5 || hour > 19.5 ? 0 : Math.sin(((hour - 6.5) / 13) * Math.PI) ** 1.4 * 40
      const x = i * pitch + (pitch - bar) / 2
      if (sun > 0.5) svg.insertAdjacentHTML("beforeend", `<rect x="${x}" y="${64 - 14 - sun}" width="${bar}" height="${sun}" fill="#8a5a14" opacity="0.28"/>`)
      svg.insertAdjacentHTML("beforeend", `<rect x="${x}" y="50" width="${bar}" height="14" fill="#17150f" opacity="0.86"/>`)
    }
  </script>
</body>
</html>
